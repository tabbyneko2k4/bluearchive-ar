<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Blue Archive AR</title>
  <meta name="description"
    content="Blue Archive AR experience with interactive 3D character world tracking.">

  <!-- Google Fonts Architecture (DESIGN.md) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Pixelify+Sans:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap"
    rel="stylesheet">

  <!-- Minimalist Pixel UI System Stylesheet -->
  <link rel="stylesheet" href="./assets/css/hud.css">

  <!-- 8th Wall & A-Frame Engine Load Order -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous"
    data-preload-chunks="slam"></script>
</head>

<body>
  <!-- HUD Layer Root -->
  <div id="mobile-ui-overlay"></div>

  <!-- A-Frame 3D Scene Viewport -->
  <a-scene xrextras-gesture-detector xrextras-component-search xrextras-loading xrextras-runtime-error
    vr-mode-ui="enabled: false" device-orientation-permission-ui-enabled="false" xrweb>

    <a-assets>
      <!-- Built-in 3D Model Assets from src/assets/models/ -->
      <a-asset-item id="model-Miyu" src="./assets/models/miyu/Miyu.glb"></a-asset-item>
    </a-assets>

    <!-- Camera with Raycaster searching for interactable cantap objects -->
    <a-camera id="camera" position="0 2 5" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse">
    </a-camera>

    <!-- Ground plane entity receiving tap-to-place gestures -->
    <a-entity id="ground" class="cantap" geometry="primitive: plane; width: 1000; height: 1000;"
      material="shader: shadow; transparent: true; opacity: 0.4" rotation="-90 0 0">
    </a-entity>

    <!-- Scene Directional, Hemisphere & Ambient Lighting for even light distribution -->
    <a-light type="directional" position="1 4 2" intensity="0.6"></a-light>
    <a-light type="ambient" intensity="1.2" color="#ffffff"></a-light>
    <a-light type="hemisphere" color="#ffffff" ground-color="#444444" intensity="0.8"></a-light>

  </a-scene>

  <!-- Webpack Bundle (Includes entry.js and src/hud.js) -->
  <script src="bundle.js"></script>
</body>

</html>
